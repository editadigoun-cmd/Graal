name: Provisit Live Updates

concurrency:
  group: provisit-capgo-publish
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'capacitor.config.*'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
      VITE_SUPABASE_URL: https://bjwcsfdvucrwtlheivuu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yw_ecNheum1JSgS56I4SSg_PKTuAuFK
      VITE_APP_TIMEZONE: Africa/Porto-Novo
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify Supabase build configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          echo "Supabase public configuration is present."
      - name: Build web bundle
        run: npm run build
      - name: Test Worker assistant IA
        run: node --test workers/sales-ai/*.test.mjs
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler@4 deploy --dry-run --config workers/sales-ai/wrangler.jsonc
      - name: Publish OTA update to Capgo
        run: npx @capgo/cli@latest bundle upload com.provisit.provisit --path ./dist --channel production --apikey "$CAPGO_API_KEY" --auto-bump patch --delta
