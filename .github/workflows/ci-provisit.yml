name: Build and type-check
on:
  pull_request:
    branches:
      - claude/mise-en-place-discussion-rb8z7s
  push:
    branches:
      - claude/mise-en-place-discussion-rb8z7s
      - feat/provisit-client-center-monthly-team-rules
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
