name: Deploy Provisit UBIPHARM Sync Worker
on:
  push:
    branches: [main]
    paths:
      - "workers/grossiste-sync/**"
      - ".github/workflows/grossiste-sync.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/grossiste-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Sync PROMO credentials to Cloudflare Worker
        if: ${{ secrets.PROMO_USERNAME != '' && secrets.PROMO_PASSWORD != '' && secrets.PROMO_SECOND_PASSWORD != '' }}
        run: |
          printf '%s' "$PROMO_USERNAME" | npx wrangler secret put PROMO_USERNAME
          printf '%s' "$PROMO_PASSWORD" | npx wrangler secret put PROMO_PASSWORD
          printf '%s' "$PROMO_SECOND_PASSWORD" | npx wrangler secret put PROMO_SECOND_PASSWORD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROMO_USERNAME: ${{ secrets.PROMO_USERNAME }}
          PROMO_PASSWORD: ${{ secrets.PROMO_PASSWORD }}
          PROMO_SECOND_PASSWORD: ${{ secrets.PROMO_SECOND_PASSWORD }}
      - name: Inspect UBIPHARM portal (read-only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 95 --connect-timeout 15 \
            -X POST "https://provisit-grossiste-sync.ccds22431.workers.dev/inspect/ubipharm" \
            -H "Authorization: Bearer $SYNC_TOKEN" -H "Content-Type: application/json")
          echo "$response" | jq .
        env:
          SYNC_TOKEN: ${{ secrets.PROVISIT_SYNC_TOKEN }}
      - name: Inspect PROMO portal login page (read-only)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          http_code=$(curl --silent --show-error --output promo-response.json --write-out "%{http_code}" --max-time 95 --connect-timeout 15 \
            -X POST "https://provisit-grossiste-sync.ccds22431.workers.dev/inspect/promo" \
            -H "Authorization: Bearer $SYNC_TOKEN" -H "Content-Type: application/json") || curl_status=$?
          echo "PROMO inspector HTTP status: ${http_code:-no-response}"
          if [ -f promo-response.json ]; then
            jq '{provider,status,source,elapsedMs,diagnostics:{title:.diagnostics.title,url:.diagnostics.url,headings:.diagnostics.headings,loginVisible:.diagnostics.loginVisible,verificationRequired:.diagnostics.verificationRequired,forms:.diagnostics.forms,inputs:.diagnostics.inputs,links:(.diagnostics.links|map({text,path})|.[:40]),tables:.diagnostics.tables,pageTextSignals:.diagnostics.pageTextSignals}}' promo-response.json 2>/dev/null || cat promo-response.json
          fi
        env:
          SYNC_TOKEN: ${{ secrets.PROVISIT_SYNC_TOKEN }}
      - name: Read-only UBIPHARM extraction preview
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          http_code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" --max-time 95 --connect-timeout 15 \
            -X POST "https://provisit-grossiste-sync.ccds22431.workers.dev/extract/ubipharm" \
            -H "Authorization: Bearer $SYNC_TOKEN" -H "Content-Type: application/json") || curl_status=$?
          echo "curl exit code: ${curl_status:-0}"
          echo "HTTP status: ${http_code:-no-response}"
          if [ -f response.json ]; then
            jq '{provider,status,authenticated,authenticationStatus,mode,reviewRequired,imported,elapsedMs,pages:(.pages|length),pageDetails:(.pages|map({title,url,text:(.text|.[0:2500]),tables,downloadCandidates,error})),diagnostics:{title:.diagnostics.title,url:.diagnostics.url,headings:.diagnostics.headings,loginVisible:.diagnostics.loginVisible,verificationRequired:.diagnostics.verificationRequired,forms:.diagnostics.forms,inputs:.diagnostics.inputs,links:(.diagnostics.links|map({text,path})|.[:40]),pageTextSignals:.diagnostics.pageTextSignals}}' response.json 2>/dev/null || cat response.json 2>/dev/null || echo "No response body."
          fi
          if [ "${curl_status:-0}" -ne 0 ]; then echo "Portal preview failed or timed out; deploy/test results remain separate."; exit 0; fi
          if [ "${http_code:-0}" -ge 500 ]; then echo "Portal preview server error; deployment/test results remain separate."; fi
        env:
          SYNC_TOKEN: ${{ secrets.PROVISIT_SYNC_TOKEN }}
      - name: Upload UBIPHARM extraction preview for review
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ubipharm-preview-${{ github.run_id }}
          path: workers/grossiste-sync/response.json
          if-no-files-found: ignore
          retention-days: 3
