name: Build Android APK

# Construit l'appli Android (Capacitor) et publie l'APK en artefact téléchargeable.
# La configuration publique Supabase est chargée depuis .env.example avant le build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
      - '.env.example'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure frontend environment
        run: cp .env.example .env

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: graal-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
