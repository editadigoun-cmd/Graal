name: Provisit Live Updates

concurrency:
  group: provisit-capgo-publish
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      CAPGO_API_KEY: ${{ secrets.CAPGO_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Publish OTA update to Capgo
        run: npx @capgo/cli@latest bundle upload com.provisit.provisit --path ./dist --channel production --apikey "$CAPGO_API_KEY" --auto-bump patch --delta
