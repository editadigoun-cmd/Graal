name: Build Android APK

# Construit l'appli Android (Capacitor) et publie l'APK signé en artefact téléchargeable.
# Déclenché manuellement, ou automatiquement si le projet Android/les icônes changent —
# volontairement PAS sur chaque push (build lourd, ~10 min).
#
# Signature : keystore committé (android/app/debug.keystore, cf. commentaire dans
# android/app/build.gradle) — convient à une distribution directe (hors Play Store) mais
# n'est pas éligible à une publication sur le Play Store. Pour ça, remplacer par un vrai
# keystore de release gardé secret (GitHub Actions secret), jamais committé.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: graal-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
