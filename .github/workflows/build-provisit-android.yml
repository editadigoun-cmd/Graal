name: Build Provisit Android APK

concurrency:
  group: provisit-android-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'src/**'
      - 'supabase/migrations/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-provisit-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://bjwcsfdvucrwtlheivuu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yw_ecNheum1JSgS56I4SSg_PKTuAuFK
      VITE_APP_TIMEZONE: Africa/Porto-Novo
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Generate Android icons from repository artwork
        run: npx capacitor-assets generate --android
      - name: Verify Supabase build configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          echo "Supabase public configuration is present."
      - name: Build web application
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Provisit-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
