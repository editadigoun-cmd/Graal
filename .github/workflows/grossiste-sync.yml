name: Deploy Provisit UBIPHARM Sync Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/grossiste-sync/**"
      - ".github/workflows/grossiste-sync.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/grossiste-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Configure Worker secrets
        run: |
          printf '%s' "$SYNC_TOKEN" | npx wrangler secret put SYNC_TOKEN
          printf '%s' "$UBIPHARM_USERNAME" | npx wrangler secret put UBIPHARM_USERNAME
          printf '%s' "$UBIPHARM_PASSWORD" | npx wrangler secret put UBIPHARM_PASSWORD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SYNC_TOKEN: ${{ secrets.PROVISIT_SYNC_TOKEN }}
          UBIPHARM_USERNAME: ${{ secrets.UBIPHARM_USERNAME }}
          UBIPHARM_PASSWORD: ${{ secrets.UBIPHARM_PASSWORD }}
      - name: Inspect UBIPHARM portal (read-only)
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST "https://provisit-grossiste-sync.ccds22431.workers.dev/inspect/ubipharm" \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json")
          echo "$response" | jq .
        env:
          SYNC_TOKEN: ${{ secrets.PROVISIT_SYNC_TOKEN }}
      - name: Inspect authenticated UBIPHARM space (read-only)
        run: |
          http_code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "https://provisit-grossiste-sync.ccds22431.workers.dev/inspect/ubipharm/authenticated" \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json")
          echo "HTTP status: $http_code"
          if jq . response.json; then
            echo "Inspection response displayed."
          else
            cat response.json
          fi
          if [ "$http_code" -ge 500 ]; then
            echo "Portal inspection returned a server error; deployment/test results remain separate."
          fi
        env:
          SYNC_TOKEN: ${{ secrets.PROVISIT_SYNC_TOKEN }}
